name: Build for Esipher

# Runs on every push (i.e. every time someone commits files here), and
# can also be triggered manually from the Actions tab. If a .zip sits
# at the repo root (the natural thing to drag in via GitHub's "Add
# file -> Upload files", with no local unzipping needed), it's
# extracted first. Either way, this then detects whichever of
# npm/yarn/pnpm/bun the project uses, installs dependencies, runs its
# build script, and uploads the result as a downloadable artifact — the
# zip you then upload to the Esipher WordPress plugin.
#
# Mirrors the same build intelligence Esipher's own "Build it now"
# button uses (Project_Builder), so a project this workflow can build,
# Esipher can too, and vice versa:
#  - Detects Lovable's cloud-hosted image descriptors and sets
#    ASSET_ORIGIN so the project's own asset-download step (if it has
#    one) can actually reach them, instead of silently failing every
#    image.
#  - Falls back to an export-static-style script (some frameworks, e.g.
#    TanStack Start, need a second script after the plain build to
#    pre-render every route to real HTML).
#  - Bridges Nitro's actual build output to the path some of those
#    export scripts hardcode expecting, when the two are out of sync.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Extract uploaded export .zip, if any
        id: source
        run: |
          zip_file=$(find . -maxdepth 1 -iname '*.zip' | head -1)

          if [ -z "$zip_file" ]; then
            echo "No .zip at the repo root — using the repo's files as-is."
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $zip_file — extracting..."
          mkdir -p _export
          unzip -q "$zip_file" -d _export

          # Many exports (GitHub's own "Download ZIP" among them) wrap
          # everything in a single top-level folder. Unwrap it so the
          # steps below find package.json etc. directly, rather than
          # one folder too deep — same idea as Esipher's own
          # Source_Detector::resolve_root().
          entry_count=$(find _export -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$entry_count" -eq 1 ]; then
            only_entry=$(find _export -mindepth 1 -maxdepth 1)
            if [ -d "$only_entry" ]; then
              echo "dir=$only_entry" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "dir=_export" >> "$GITHUB_OUTPUT"

      - name: Remove any pre-existing build output
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          # A repo can end up with committed build output sitting
          # alongside its source — e.g. an export that bundled a
          # static-export/ folder together with the raw source it was
          # built from, or a .gitignore that doesn't exclude dist/.
          # Left in place, that's indistinguishable from a genuine
          # fresh build to "Locate build output" below, so it would get
          # used as-is without this workflow ever actually building
          # anything — potentially stale or incomplete (verified
          # against a real repo: a bundled static-export/ missing
          # images its own export process never actually downloaded).
          # Removing every recognized output location up front
          # guarantees whatever's found later only ever came from this
          # run.
          removed=""
          for dir in static-export dist build out .output; do
            if [ -e "$dir" ]; then
              rm -rf "$dir"
              removed="$removed $dir"
            fi
          done
          if [ -n "$removed" ]; then
            echo "Removed pre-existing build output before building fresh:$removed"
          else
            echo "No pre-existing build output found — nothing to remove."
          fi

      - name: Detect package manager
        id: detect
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            manager=bun
          elif [ -f pnpm-lock.yaml ]; then
            manager=pnpm
          elif [ -f yarn.lock ]; then
            manager=yarn
          else
            manager=npm
          fi
          echo "Detected: $manager"
          echo "manager=$manager" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        if: steps.detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up Bun
        if: steps.detect.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          case "${{ steps.detect.outputs.manager }}" in
            npm)  npm install ;;
            yarn) yarn install ;;
            pnpm) pnpm install ;;
            bun)  bun install ;;
          esac

      - name: Detect Lovable cloud-hosted image origin
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          if [ -n "$ASSET_ORIGIN" ]; then
            echo "ASSET_ORIGIN already set in the environment — leaving it alone."
            exit 0
          fi

          descriptor=$(find src/assets -maxdepth 4 -iname '*.asset.json' 2>/dev/null | head -1)

          if [ -z "$descriptor" ]; then
            echo "No Lovable *.asset.json descriptor found — nothing to detect."
            exit 0
          fi

          project_id=$(grep -oE '"project_id"[[:space:]]*:[[:space:]]*"[^"]+"' "$descriptor" | sed -E 's/.*:[[:space:]]*"([^"]+)"/\1/' | head -1)

          if [ -z "$project_id" ]; then
            echo "Found a descriptor but couldn't read its project_id — skipping."
            exit 0
          fi

          origin="https://${project_id}.lovableproject.com"
          echo "Detected Lovable cloud-hosted image references — setting ASSET_ORIGIN=$origin"
          echo "ASSET_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          case "${{ steps.detect.outputs.manager }}" in
            npm)  npm run build ;;
            yarn) yarn build ;;
            pnpm) pnpm build ;;
            bun)  bun run build ;;
          esac

      - name: Locate build output
        id: output
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          find_output() {
            for dir in dist build out .output/public; do
              if [ -d "$dir" ] && { [ -f "$dir/index.html" ] || [ -d "$dir/static-export" ]; }; then
                echo "$dir"
                return 0
              fi
            done
            if [ -d "static-export" ]; then
              echo "static-export"
              return 0
            fi
            return 1
          }

          # Whatever find_output() sees from here on can only be
          # something this run actually produced — the previous step
          # already removed every recognized output location that
          # might otherwise have been a stale leftover from the repo
          # itself.
          if out=$(find_output); then
            echo "dir=$out" >> "$GITHUB_OUTPUT"
            echo "Found build output in: $out"
            exit 0
          fi

          # Nothing recognizable from the plain build yet. Some projects
          # (TanStack Start/Nitro among them) ship a separate script that
          # pre-renders every route to real HTML as a second step — try
          # that next, same as Esipher's own Project_Builder does.
          for script in export:static export-static static:export; do
            if ! grep -q "\"$script\"" package.json 2>/dev/null; then
              continue
            fi

            echo "Trying the '$script' script..."

            # Bridge Nitro's actual build output to the paths some
            # export scripts hardcode expecting (dist/server,
            # dist/client) — verified necessary against a real export
            # whose own script otherwise fails with "Build output
            # missing" despite the build above having just succeeded.
            # Never overwrites an existing dist/ — only fires when the
            # script's expected path is genuinely missing.
            if [ -d .output/server ] && [ ! -e dist/server ]; then
              mkdir -p dist
              cp -r .output/server dist/server
              echo "Bridged .output/server -> dist/server"
            fi
            if [ -d .output/public ] && [ ! -e dist/client ]; then
              mkdir -p dist
              cp -r .output/public dist/client
              echo "Bridged .output/public -> dist/client"
            fi

            export_exit=0
            case "${{ steps.detect.outputs.manager }}" in
              npm)  npm run "$script" || export_exit=$? ;;
              yarn) yarn "$script" || export_exit=$? ;;
              pnpm) pnpm "$script" || export_exit=$? ;;
              bun)  bun run "$script" || export_exit=$? ;;
            esac

            if [ "$export_exit" -ne 0 ]; then
              echo "::error::\"$script\" exited with code $export_exit. See the log above for details — an output folder that shows up anyway despite this is incomplete, not a real success."
              exit "$export_exit"
            fi

            break
          done

          if out=$(find_output); then
            echo "dir=$out" >> "$GITHUB_OUTPUT"
            echo "Found build output in: $out"
            exit 0
          fi

          echo "::error::No build output folder found (looked for dist/, build/, out/, .output/public/, static-export/). Check the 'Build' step's log above for the actual error."
          exit 1

      - name: Prepare artifact contents
        id: artifact
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          out="${{ steps.output.outputs.dir }}"

          # actions/upload-artifact zips the *contents* of whatever path
          # it's given — it never preserves that path's own folder name
          # inside the resulting archive. That's harmless for a
          # single-page build (dist/, build/, ...): Esipher just needs
          # index.html at the zip root either way, which flattening
          # still gives it. It's a real problem specifically when $out
          # is the multi-page static-export/ folder found directly at
          # the project root: Esipher's Source_Detector::
          # resolve_multi_page_root() looks for a folder literally named
          # static-export, so uploading its contents flattened makes
          # Esipher silently (mis)detect an ordinary single-page export
          # instead — converting only the home route and leaving every
          # other page showing nothing but that same home content, with
          # no error to explain why. Re-wrap it here so the artifact
          # keeps that name.
          if [ "$out" = "static-export" ]; then
            rm -rf _artifact
            mkdir -p _artifact/static-export
            cp -r static-export/. _artifact/static-export/
            echo "path=$(pwd)/_artifact" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(pwd)/$out" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: esipher-build
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
